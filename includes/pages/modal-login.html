
    <div id="modal-form-validate" class="bg-modal-login d-none">
        <div class="bg-modal-login-child">
            <div class="modal-header">
                <h2>Entre com o código</h2>
                <span id="close-form-validate" aria-hidden="true">&times;</span>
            </div>
            <form id="form-validate" method="post" >
                <p class="text-left mb-15" >Enviamos um SMS com seu código de acesso, informe-o abaixo.</p>

                <p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide mb-0">
                    <input type="hidden" name="form-validate">
                    <input id="code" type="text" class="woocommerce-Input woocommerce-Input--text input-text" maxlength="6"
                           name="code" placeholder="Código" pattern="[0-9]{6}" title="O código tem seis (6) números" required autofocus />

                    <!-- Error message -->
                    <p id="error-valid" class="bg-transp text-center text-danger pt-8 mb-0 d-none" ></p>
                    <p id="code-resend" class="bg-transp float-left text-dark pb-20 mt-20 mb-0 d-none" >Código reenviado</p>
                    <a id="resend"      class="bg-transp float-right pointer pb-20 mt-20 mb-0" onclick="resendCode()" >Reenviar código</a>
                </p>
                <button id="btn-form-validate" type="submit" class="woocommerce-Button button set-spin" >Entrar <div class="d-none spin-load"></div></button>
            </form>
        </div>
    </div>

    <div id="modal-form-validate-email" class="bg-modal-login d-none">
        <div class="bg-modal-login-child">
            <div class="modal-header">
                <h2>Entre com o código</h2>
                <span id="close-form-validate-email" aria-hidden="true">&times;</span>
            </div>
            <form id="form-validate-email" method="post" >
                <p class="text-left mb-15" >Enviamos um e-mail com seu código de acesso, informe-o abaixo.</p>

                <p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide mb-0">
                    <input type="hidden" name="form-validate-email">
                    <input id="code-email" type="text" class="woocommerce-Input woocommerce-Input--text input-text" maxlength="6"
                           name="code" placeholder="Código" pattern="[0-9]{6}" title="O código tem seis (6) números" required autofocus />

                    <!-- Error message -->
                    <p id="error-valid-email" class="bg-transp text-center text-danger pt-8 mb-0 d-none" ></p>
                    <p id="code-resend-email" class="bg-transp float-left text-dark pb-20 mt-20 mb-0 d-none" >Código reenviado</p>
                    <a id="resend-email"      class="bg-transp float-right pointer pb-20 mt-20 mb-0" onclick="resendCodeEmail()" >Reenviar código</a>
                </p>
                <button id="btn-form-validate-email" type="submit" class="woocommerce-Button button set-spin" >Entrar <div class="d-none spin-load"></div></button>
            </form>
        </div>
    </div>

    <div id="modal-form-register" class="bg-modal-login d-none">
        <div class="bg-modal-login-child">
            <div class="modal-header">
                <h2 id="register-title" ></h2>
                <span id="close-form-register" aria-hidden="true">&times;</span>
            </div>
            <form id="form-register" method="post" >
                <p id="register-p1" class="text-left mb-5" ></p>
                <p id="register-p2" class="text-left mb-5" ></p>
                <p id="register-p3" class="text-left mb-15" ></p>

                <p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide">
                    <input type="hidden" name="form-register">
                    <input type="email" class="woocommerce-Input woocommerce-Input--text input-text" requered placeholder="Endereço de e-mail"
                        name="email" id="form-register-email" autocomplete="email" autofocus >
                </p>

                <p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide">
                    <input type="password" class="woocommerce-Input woocommerce-Input--text input-text" requered placeholder="Senha"
                        name="password" id="form-register-password" autocomplete="password" >
                </p>

                <p class="woocommerce-form-row woocommerce-form-row--wide form-row form-row-wide mb-0">
                    <!-- Error message -->
                    <p id="error-register" class="bg-transp text-center text-danger pt-20 mb-0 d-none" ></p>
                </p>

                <button id="btn-form-register" type="submit" class="woocommerce-Button button set-spin" >Entrar <div class="d-none spin-load"></div></button>
            </form>
        </div>
    </div>

    <style>
        /* #register-now, .title-optin {
            font-weight: 650 !important;
            font-size: 15px !important;
        } */
        .title-optin {
            margin: 0 0 10px !important;
            font-weight: 650 !important;
        }

        /* Helpers error */
        .error-border { border-color: #D45757 !important; }

        .bg-transp    { background-color: transparent !important; }
        .d-none       { display: none !important; }
        .d-flex       { display: flex !important; }

        .text-left    { text-align: left !important; }
        .text-center  { text-align: center !important; }
        .text-danger  { color: #d45757 !important; font-weight: bold; }
        .text-dark    { color: #343a40 !important; font-weight: bold; }

        .float-left   { float: left !important; }
        .float-right  { float: right !important; }

        .pt-8         { padding-top:  8px !important; }
        .pt-20        { padding-top: 20px !important; }
        .pb-20        { padding-bottom: 20px !important; }

        .mt-20        { margin-top: 20px !important; }
        .mb-0         { margin-bottom: 0 !important; }
        .mb-5         { margin-bottom: 5px !important; }
        .mb-15        { margin-bottom: 15px !important; }

        .pointer      { cursor: pointer; }

        /* css comum entre, .bg-modal-load-next-page e .bg-modal-load-checkout */
        .bg-modal-login { top: 0; left: 0; width: 100vw; height: 100vh; display: flex; position: fixed; overflow: auto; z-index: 99999999; text-align: center; justify-content: space-between; background-color: rgb(0,0,0); background-color: rgba(0,0,0,0.7); }

        /* modal de centralização, texto e load-gif - checkout */
        .bg-modal-login-child { width: 80%; margin: auto; border-radius: 5px; background-color: #FEFEFE; border-radius: 5px; background-color: #FFF; padding: 35px 30px; border: 1px solid #E8E8E8; }
        .bg-modal-login-child h2 { text-align: left; margin: 0 0 25px 0 !important; }
        .bg-modal-login-child .modal-header { display: flex; flex-direction: row; justify-content: space-between; }
        .bg-modal-login-child .modal-header span { font-size: 20px; cursor: pointer; }
        /* .bg-modal-login-child p { margin-bottom: 0 !important; } */
        .bg-modal-login-child .button { width: 100%; font-size: 16px; margin-top: 20px !important; border-radius: 3px; height: 53px; line-height: 53px; }

        /* tamanho do checchout-child de acordo com a tela */
        @media (min-width: 576px) {
            .bg-modal-login-child { width: 60%; }
        }
        @media (min-width: 768px) {
            .bg-modal-login-child { width: 40%; }
        }
        @media (min-width: 992px) {
            .bg-modal-login-child { max-width: 430px; }
        }

        .set-spin {
            display: flex!important;
            justify-content: center;
        }
        .spin-load {
            width: 20px;
            height: 20px;
            margin: auto 5px;
            border: 3px solid #F2F2F2;
            border-top: 3px solid #AEAEAE;
            border-radius: 50%;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js" ></script>
    <script>
        jQuery( "#cellphone" ).mask( "+55 (00) 00000-0000" );
        jQuery( "#cellphone" ).blur( function( event ) {
            if( jQuery(this).val().length == 19 )
            {
                // Celular com 9 dígitos + 2 dígitos DDD e 8 da máscara
                jQuery( "#cellphone" ).mask( "+55 (00) 00000-0009" );
            }
            else
            {
                jQuery( "#cellphone" ).mask( "+55 (00) 0000-00009" );
            }
        });

        let genericError1  = "Ocorreu um erro, tente novamente.";
        let genericError2  = "Algo deu errado, tente novamente.";

        // vars parametros ajax
        let code          = null;
        let codeEmail     = null;
        let email         = null;
        let pass          = null;
        let cellphone     = null;
        let transactionId = null;


        // vars AUTH
        let error_auth    = document.getElementById( "error-auth"    );
        let btn_auth      = document.getElementById( "btn-form-auth" );


        // vars validate
        let modal_valid   = document.getElementById( "modal-form-validate" );
        let error_valid   = document.getElementById( "error-valid"         );
        let btn_valid     = document.getElementById( "btn-form-validate"   );


        // vars validate email
        let modal_v_email = document.getElementById( "modal-form-validate-email" );
        let error_v_email = document.getElementById( "error-valid-email"         );
        let btn_v_email   = document.getElementById( "btn-form-validate-email"   );


        // vars register
        let modal_regis   = document.getElementById( "modal-form-register" );
        let error_regis   = document.getElementById( "error-register"      );
        let btn_regis     = document.getElementById( "btn-form-register"   );


        /**
         * Monitora todos os clicks na página
         * Verifica IDs especificos
         */
        window.addEventListener( "click", function ( e ) {
            switch ( e.target.id )
            {
                case "close-form-auth":
                case "close-form-validate":
                case "close-form-validate-email":
                case "close-form-register":
                    window.closeModal();
                break;

                case "btn-form-auth":
                    e.preventDefault();
                    window.submitAuth();
                break;

                case "btn-form-validate":
                    e.preventDefault();
                    window.submitValidate();
                break;

                case "btn-form-validate-email":
                    e.preventDefault();
                    window.submitValidateEmail();
                break;

                case "btn-form-register":
                    e.preventDefault();
                    window.submitRegister();
                break;
            }
        }, false);


        /**
         * Reenvia codigo por sms
         */
        window.resendCode = function ()
        {
            jQuery( btn_auth ).click();

            disableBtns();

            jQuery( error_valid    ).addClass( "d-none" );
            jQuery( "#code"        ).removeClass( "error-border" );
            jQuery( "#code-resend" ).removeClass( "d-none" );

            setTimeout( function() {
                enableBtns();
                jQuery( "#code-resend" ).addClass( "d-none" );
            }, 3000 );
        }

        /**
         * Reenvia codigo por email
         */
        window.resendCodeEmail = function ()
        {
            disableBtns();

            jQuery( error_v_email        ).addClass( "d-none" );
            jQuery( "#code-email"        ).removeClass( "error-border" );

            email = jQuery( "#form-register-email" ).val();

            jQuery.ajax({
                url : "/wp-admin/admin-ajax.php",
                type: "POST",
                data: {
                    action : "TAL_resend_email_code",
                    email  : email
                },
                success: function( data ) {
                    // console.log( JSON.parse( data ) );

                    let result = JSON.parse( data );

                    enableBtns();

                    if ( result.error != null)
                    {
                        jQuery( error_v_email ).removeClass( "d-none" ).html( genericError1 );
                    }
                    else
                    {
                        jQuery( "#code-email" ).focus();
                        jQuery( "#code-resend-email" ).removeClass( "d-none" );

                        setTimeout( function() {
                            jQuery( "#code-resend-email" ).addClass( "d-none" );
                        }, 3000 );
                    }
                },
                error: function( err ) {
                    ajaxError( err );
                }
            });
        }


        /**
         * Fecha modais
         */
        window.closeModal = function()
        {
            enableBtns();
            hideModals();
            hideErros();
        }


        /**
         * Valida celular e chama função para enviar código por SMS
         */
        window.submitAuth = function()
        {
            disableBtns();

            cellphone = jQuery( "#cellphone" ).val();

            if ( cellphone != "" )
            {
                jQuery( error_auth   ).addClass( "d-none" );
                jQuery( "#cellphone" ).removeClass( "error-border" );

                // envia o código por sms
                callAuthAjax();
            }
            else
            {
                enableBtns();
                jQuery( error_auth ).removeClass( "d-none" ).html( "Insira um número de celular." );
            }
        }


        /**
         * Envia código por sms e abre modal de validação
         */
        window.callAuthAjax = function ()
        {
            jQuery.ajax({
                url : "/wp-admin/admin-ajax.php",
                type: "POST",
                data: {
                    action    : "TAL_auth_sms",
                    cellphone : cellphone
                },
                success: function( data ) {
                    console.log( JSON.parse( data ) );

                    let result = JSON.parse( data );

                    enableBtns();

                    if ( result.error != null)
                    {
                        let errorMsg = "";

                        if ( result.error.errorCode == 1005 )
                        {
                            errorMsg = "Quantidade de tentativas excedida, tente novamente em 15min.";
                            jQuery( "#cellphone" ).addClass( "error-border" );
                        }
                        else
                        {
                            errorMsg = genericError2;
                        }

                        jQuery( error_auth ).removeClass( "d-none" ).html( errorMsg );
                    }
                    else
                    {
                        transactionId = result.success.transactionId;

                        jQuery( modal_valid ).removeClass( "d-none" );
                        jQuery( "#code" ).focus();
                    }
                },
                error: function( err ) {
                    ajaxError( err );
                }
            });
        }


        /**
         * Valida se foi informado um código SMS e chama função de validação do código SMS
         */
        window.submitValidate = function()
        {
            disableBtns();

            code = jQuery( "#code" ).val();

            if ( code != "" && code.length == 6 )
            {
                jQuery( error_valid ).addClass( "d-none" );
                jQuery( "#code" ).removeClass( "error-border" );

                // valida código informado
                callValidateSMS();
            }
            else
            {
                enableBtns();
                errorMsg = ( code == "" ) ? "Insira código recebido." : "O código tem 6 dígitos." ;
                jQuery( error_valid ).removeClass( "d-none" ).html( errorMsg );
            }
        }

        /**
         * Valida o código do sms e chama função que busca o usuário na Triibo e no Mkt
         */
        window.callValidateSMS = function ()
        {
            jQuery.ajax({
                url : "/wp-admin/admin-ajax.php",
                type: "POST",
                data: {
                    action        : "TAL_validate_sms",
                    code          : code,
                    cellphone     : cellphone,
                    transactionId : transactionId
                },
                success: function( data ) {
                    console.log( JSON.parse( data ) );

                    let result = JSON.parse( data );

                    if ( result.error != null )
                    {
                        enableBtns();

                        switch ( result.error.errorCode )
                        {
                            case 1006:
                                jQuery( error_valid  ).removeClass( "d-none" ).html( "Código inválido." );
                                jQuery( "#code"      ).addClass( "error-border" );
                            break;

                            case 1007:
                                jQuery( error_valid  ).removeClass( "d-none" ).html( "Código expirado." );
                                jQuery( "#code"      ).addClass( "error-border" );
                            break;

                            case 1009:
                                jQuery( modal_valid  ).addClass("d-none");
                                jQuery( error_auth   ).removeClass( "d-none" ).html( "Código expirado." );
                                jQuery( "#cellphone" ).addClass( "error-border" );
                            break;

                            case 1005:
                                jQuery( modal_valid  ).addClass("d-none");
                                jQuery( error_auth   ).removeClass( "d-none" ).html( "Quantidade de tentativas excedida, tente novamente em 15min." );
                                jQuery( "#cellphone" ).addClass( "error-border" );
                            break;

                            case 1004:
                            case 1008:
                            default:
                                jQuery( modal_valid  ).addClass("d-none");
                                jQuery( error_auth   ).removeClass( "d-none" ).html( "Algo de erro, tente novamente." );
                            break;
                        }
                    }
                    else
                    {
                        disableBtns();
                        jQuery( "#modal-load-next-page" ).removeClass( "bgml-d-none" );

                        // busca usuário
                        callUserInfo();
                    }
                },
                error: function( err ) {
                    ajaxError( err );
                }
            });
        }

        /**
         * Busca usuário na Triibo.
         * Caso não exista, abre modal de email e senha.
         * Caso exista, ??? // redireciona para página do perfil.
         */
        window.callUserInfo = function()
        {
            jQuery.ajax({
                url : "/wp-admin/admin-ajax.php",
                type: "POST",
                data: {
                    action    : "TAL_user_info",
                    cellphone : cellphone,
                },
                success: function( data ) {
                    console.log( JSON.parse( data ) );

                    let result = JSON.parse( data );

                    if ( result.error != null )
                    {
                        enableBtns();

                        switch ( result.error.code )
                        {
                            // tem conta na Triibo, mas não tem conta mkt
                            case 401:
                                jQuery( "#modal-load-next-page" ).addClass( "bgml-d-none" );
                                jQuery( modal_valid ).addClass( "d-none" );
                                jQuery( modal_regis ).removeClass( "d-none" );

                                let t1 = "Complete seu cadastro";
                                let p1 = "Notamos que sua conta Triibo ainda não está associada a uma conta Marketplace.";
                                setRegistertexts( t1, p1 );
                            break;

                            // não encontrou número na Triibo
                            case 404:
                                jQuery( "#modal-load-next-page" ).addClass( "bgml-d-none" );
                                jQuery( modal_valid ).addClass( "d-none" );
                                jQuery( modal_regis ).removeClass( "d-none" );

                                let t4 = "Complete seu cadastro";
                                let p4 = "Notamos que seu número ainda não está associado a uma conta Triibo.";
                                setRegistertexts( t4, p4 );
                            break;

                            // erro na consulta a Triibo
                            case 500:
                            default:
                                jQuery( "#modal-load-next-page" ).addClass( "bgml-d-none" );
                                jQuery( modal_valid ).addClass( "d-none" );
                                jQuery( error_auth  ).removeClass( "d-none" ).html( genericError1 );
                            break;
                        }
                    }
                    else
                    {
                        disableBtns();
                        hideModals();
                        jQuery( "#modal-load-next-page" ).removeClass( "bgml-d-none" );
                        window.location.reload();
                    }
                },
                error: function( err ) {
                    ajaxError( err );
                }
            });
        }


        /**
         * Verifica email e senha informados, chama função de validação conta Mkt
         */
        window.submitRegister = function()
        {
            disableBtns();

            email = jQuery( "#form-register-email" ).val();
            pass  = jQuery( "#form-register-password" ).val();

            if ( email != "" && ( pass != "" && pass.length >= 8 ) )
            {
                jQuery( error_regis ).addClass( "d-none" );
                jQuery( "#form-register-email"    ).removeClass( "error-border" );
                jQuery( "#form-register-password" ).removeClass( "error-border" );
                jQuery( "#modal-load-next-page"   ).removeClass( "bgml-d-none" );

                // Busca usuário
                callFindUser();
            }
            else
            {
                enableBtns();
                jQuery( error_regis ).removeClass( "d-none" ).html( "E-mail/Senha não podem ser em branco. A senha deve ter no mínimo 8 caracteres." );
            }
        }

        /**
         * Verifica se email existe no Mkt.
         * Caso não exista, envia código por email, abre modal de validação de código.
         * Caso exista, valida senha. Se estiver correta, cria usuário na Triibo, se não, exibe erro.
         */
        window.callFindUser = function()
        {
            jQuery.ajax({
                url : "/wp-admin/admin-ajax.php",
                type: "POST",
                data: {
                    action    : "TAL_find_user",
                    cellphone : cellphone,
                    email     : email,
                    password  : pass,
                },
                success: function( data ) {
                    // console.log( JSON.parse( data ) );

                    let result = JSON.parse( data );

                    enableBtns();

                    if ( result.error != null )
                    {
                        jQuery( "#modal-load-next-page" ).addClass( "bgml-d-none" );

                        switch ( result.error.code )
                        {
                            // email não cadastrado no marketplace
                            case 301:
                                jQuery( modal_regis   ).addClass( "d-none" );
                                jQuery( modal_v_email ).removeClass( "d-none" );
                                jQuery( "#code-email" ).focus();
                            break;

                            // email/senha não conferem
                            case 401:
                            default:
                                jQuery( error_regis ).removeClass( "d-none" ).html( "E-mail e/ou senha incorreta" );
                                jQuery( "#form-register-email"    ).addClass( "error-border" );
                                jQuery( "#form-register-password" ).addClass( "error-border" );
                            break;
                        }
                    }
                    else
                    {
                        disableBtns();
                        hideModals();
                        jQuery( "#modal-load-next-page" ).removeClass( "bgml-d-none" );
                        window.location.reload();
                    }
                },
                error: function( err ) {
                    ajaxError( err );
                }
            });
        }


        /**
         * Valida se foi informado um código EMAIL e chama função de validação do código EMAIL
         */
        window.submitValidateEmail = function()
        {
            disableBtns();

            codeEmail = jQuery( "#code-email" ).val();

            if ( code != "" && code.length == 6 )
            {
                jQuery( error_v_email ).addClass( "d-none" );
                jQuery( "#code-email" ).removeClass( "error-border" );

                // valida código informado
                callValidateEmail();
            }
            else
            {
                enableBtns();

                errorMsg = ( codeEmail == "" ) ? "Insira código recebido." : "O código tem 6 dígitos." ;
                jQuery( error_v_email ).removeClass( "d-none" ).html( errorMsg );
            }
        }

        /**
         * Valida o código do email.
         * Caso valide, cria conta na Triibo e no Mkt, e redireciona para o página do perfil do usuário
         * Caso não, exibe erro.
         */
         window.callValidateEmail = function ()
        {
            jQuery.ajax({
                url : "/wp-admin/admin-ajax.php",
                type: "POST",
                data: {
                    action    : "TAL_validate_code_email",
                    codeEmail : codeEmail,
                    cellphone : cellphone,
                    email     : email,
                    password  : pass
                },
                success: function( data ) {
                    // console.log( JSON.parse( data ) );

                    let result = JSON.parse( data );

                    if ( result.error != null )
                    {
                        enableBtns();

                        switch ( result.error.code )
                        {
                            // código informado incorreto
                            case 401:
                                jQuery( error_v_email ).removeClass( "d-none" ).html( "Código inválido." );
                                jQuery( "#code-email" ).addClass( "error-border" );
                            break;

                            // erro interno
                            case 500:
                            default:
                                jQuery( modal_v_email ).addClass("d-none");
                                jQuery( error_auth    ).removeClass( "d-none" ).html( genericError2 );
                            break;
                        }
                    }
                    else
                    {
                        disableBtns();
                        hideModals();
                        jQuery( "#modal-load-next-page" ).removeClass( "bgml-d-none" );
                        window.location.reload();
                    }
                },
                error: function( err ) {
                    ajaxError( err );
                }
            });
        }



        /**
         * Desabilita os botões dos modais
         */
        window.disableBtns = function ()
        {
            jQuery( btn_auth    ).prop( "disabled", "disabled" ).find( "div" ).removeClass( "d-none" );
            jQuery( btn_valid   ).prop( "disabled", "disabled" ).find( "div" ).removeClass( "d-none" );
            jQuery( btn_v_email ).prop( "disabled", "disabled" ).find( "div" ).removeClass( "d-none" );
            jQuery( btn_regis   ).prop( "disabled", "disabled" ).find( "div" ).removeClass( "d-none" );
        }

        /**
         * Habilita os botões dos modais
         */
        window.enableBtns = function ()
        {
            jQuery( btn_auth    ).prop( "disabled", null ).find( "div" ).addClass( "d-none" );
            jQuery( btn_valid   ).prop( "disabled", null ).find( "div" ).addClass( "d-none" );
            jQuery( btn_v_email ).prop( "disabled", null ).find( "div" ).addClass( "d-none" );
            jQuery( btn_regis   ).prop( "disabled", null ).find( "div" ).addClass( "d-none" );
        }

        /**
         * Esconde os modais
         */
        window.hideModals = function ()
        {
            jQuery( modal_valid   ).addClass( "d-none" );
            jQuery( modal_v_email ).addClass( "d-none" );
            jQuery( modal_regis   ).addClass( "d-none" );
        }

        /**
         * Esconde os pagagrafos de erros
         */
        window.hideErros = function ()
        {
            jQuery( error_auth    ).addClass( "d-none" ).html( "" );
            jQuery( error_valid   ).addClass( "d-none" ).html( "" );
            jQuery( error_v_email ).addClass( "d-none" ).html( "" );
            jQuery( error_regis   ).addClass( "d-none" ).html( "" );
        }

        /**
         * Exibe erro no console quando há falha no ajax.
         */
        window.ajaxError = function ( err )
        {
            console.log( err );
            hideModals();
            enableBtns();
            jQuery( "#modal-load-next-page" ).addClass( "bgml-d-none" );
            jQuery( error_auth ).removeClass( "d-none" ).html( genericError1 );
        }

        window.setRegistertexts = function ( t, p )
        {
            jQuery( "#register-title" ).html( t );
            jQuery( "#register-p1"    ).html( p );
            jQuery( "#register-p2"    ).html( "Informe o e-mail e a senha da sua conta Marketplace para completarmos seu cadastro." );
            jQuery( "#register-p3"    ).html( "Caso não tenha uma conta no Marketplace, criaremos uma para você." );
        }

    </script>
